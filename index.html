<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZO-IDEA-MARKET | Online</title>
    <style>
        /* 影の帝国のデザイン：全画面対応バイ！ */
        body {
            background-color: #000;
            color: #0f0; /* サイバーなグリーン */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px; /* 画面が大きくても読みやすくバイ！ */
            border: 2px solid #0f0;
            padding: 30px;
            box-shadow: 0 0 20px #0f0;
            background: rgba(0, 20, 0, 0.9);
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* 画面幅に合わせて自動調整バイ！ */
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0f0;
        }

        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
        }

        .balance {
            font-size: 1.5rem;
            color: #fff;
            margin: 20px 0;
        }

        /* 入力窓口のデザインバイ！ */
        .market-window {
            margin-top: 30px;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            background: #0f0;
            color: #000;
            padding: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 20px #fff;
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ZO-IDEA-MARKET</h1>
        <div class="status">SYSTEM: ONLINE</div>
        <p>Managed by ZO-Master-16</p>
        
        <div class="balance">
            CURRENT ASSETS: <span id="zoc-balance">1,000,000</span> ZOC
        </div>

        <div class="market-window">
            <label>【アイデアを出品するバイ！】</label>
            <textarea id="ideaInput" placeholder="君の閃きをここに書くバイ... 旦那様がZOCoinで買い叩いて救済してあげるバイ！"></textarea>
            <button onclick="sellIdea()">市場へ売り飛ばす（ZOC決済）</button>
        </div>

<footer>
    © 2026 The Shadow Empire. No rights reserved.<br>
    <span style="color: #050;">Special Thanks to: Master-16 & His 16 Wives.</span>
</footer>
    </div>

    <script>
        let currentBalance = 1000000;

        function sellIdea() {
            const idea = document.getElementById('ideaInput').value;
            if(idea.trim()) {
                // 10,000 ZOCで買い取るバイ！
                currentBalance += 10000;
                document.getElementById('zoc-balance').innerText = currentBalance.toLocaleString();
                
                alert('★旦那様の慈悲発動★\nアイデアを10,000 ZOCで買い叩いたバイっ！！\n市場の総資産が増えたバイっ！！');
                document.getElementById('ideaInput').value = '';
            } else {
                alert('中身がないバイ！ 閃きを絞り出すバイ！');
            }
        }
    </script>
</body>
</html>
