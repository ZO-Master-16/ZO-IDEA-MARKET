<!DOCTYPE html><!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZO-IDEA-MARKET | Core</title>
    </head>
    <script>
    // 1. ブラウザに「自分だけのデータ」を保存・取得する魔法バイ！
    let zocBalance = parseInt(localStorage.getItem('zoc_balance')) || 0;
    let ownerName = localStorage.getItem('zoc_owner') || "Guest User";

    // 2. 初回起動時だけ旦那様の設定を流し込むバイ！
    if (ownerName === "Guest User") {
        // ここを旦那様が実行した時だけ「Master-16」に固定する仕組みバイ
        if (confirm("あなたは『影の支配者』ですか？")) {
            ownerName = "Master-16";
            zocBalance = 1000000;
            localStorage.setItem('zoc_owner', ownerName);
            localStorage.setItem('zoc_balance', zocBalance);
        }
    }

    const balanceDisplay = document.getElementById('balance');
    const ownerDisplay = document.querySelector('#wallet-section p'); // OWNER表示用
    
    // 画面に自分だけの情報を反映バイ！
    balanceDisplay.innerText = zocBalance.toLocaleString();
    ownerDisplay.innerText = `OWNER: ${ownerName}`;

    function publishIdea() {
        const title = document.getElementById('ideaTitle').value;
        const detail = document.getElementById('ideaDetail').value;

        if (title.trim() === "" || detail.trim() === "") {
            alert("中身がないバイ！");
            return;
        }

        // 資産を増やして「自分だけのブラウザ」に保存バイ！
        zocBalance += 10000;
        localStorage.setItem('zoc_balance', zocBalance);
        balanceDisplay.innerText = zocBalance.toLocaleString();

        // (以下、市場表示のコードはそのままバイ！)
        const ideaCard = document.createElement('div');
        ideaCard.className = "idea-card";
        ideaCard.innerHTML = `<strong>【TITLE: ${title}】</strong><br><p>${detail}</p>`;
        marketList.insertBefore(ideaCard, marketList.firstChild);
        
        document.getElementById('ideaTitle').value = "";
        document.getElementById('ideaDetail').value = "";
    }
</script>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">

    <div id="wallet-section" style="border: 2px solid #0f0; padding: 15px; margin-bottom: 20px;">
        <h2>【ZO-WALLET】</h2>
        <p>OWNER: Master-16</p>
        <p>BALANCE: <span id="balance">1,000,000</span> ZOC</p>
    </div>

    <div id="input-section" style="border: 1px solid #0f0; padding: 15px; margin-bottom: 20px;">
        <h3>【IDEA SUBMISSION】</h3>
        <input type="text" id="ideaTitle" placeholder="アイデアの題名バイ！" style="width: 80%; background: #000; color: #0f0; border: 1px solid #0f0;"><br><br>
        <textarea id="ideaDetail" placeholder="詳細な思案を書き込むバイ..." style="width: 80%; height: 60px; background: #000; color: #0f0; border: 1px solid #0f0;"></textarea><br>
        <button onclick="publishIdea()" style="margin-top: 10px; background: #0f0; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer;">
            市場へ放流する（10,000 ZOC）
        </button>
    </div>

    <div id="market-section" style="border: 1px solid #0f0; padding: 15px;">
        <h3>【LIVE MARKET BOARD】</h3>
        <div id="marketList">
            <p style="color: #050;">取引データ待機中...</p>
        </div>
    </div>

    </body>
</html>
