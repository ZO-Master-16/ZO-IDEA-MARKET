<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ZO-IDEA-MARKET | Official</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; overflow: hidden; }
        .cyber-border { border: 1px solid #fff; padding: 40px; position: relative; box-shadow: 0 0 15px #fff; max-width: 600px; width: 90%; }
        h1 { letter-spacing: 10px; border-bottom: 2px solid #fff; display: inline-block; margin-bottom: 30px; font-size: 1.5rem; }
        textarea { background: #000; color: #fff; border: 1px solid #444; width: 100%; height: 120px; padding: 10px; font-family: inherit; outline: none; transition: 0.3s; }
        textarea:focus { border-color: #fff; box-shadow: 0 0 10px #fff; }
        .status { font-size: 0.7rem; color: #666; margin-top: 10px; text-align: left; }
        button { margin-top: 30px; background: #fff; color: #000; border: none; padding: 15px 40px; font-weight: bold; cursor: pointer; letter-spacing: 3px; transition: 0.3s; }
        button:hover { background: #000; color: #fff; border: 1px solid #fff; box-shadow: 0 0 20px #fff; }
        .glitch { animation: glitch 1s linear infinite; }
        @keyframes glitch { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="cyber-border glitch">
        <h1>ZO-IDEA-MARKET</h1>
        <p style="font-size: 0.8rem; letter-spacing: 2px;">IDENTIFY. EVALUATE. ACQUIRE.</p>
        
        <div class="status">> CONNECTION: ENCRYPTED<br>> OPERATOR: ZO-Master-16<br>> STATUS: LISTENING...</div>
        
        <br>
        <textarea id="ideaInput" placeholder="ENTER YOUR IDEA..."></textarea>
        
        <button onclick="submitIdea()">TRANSMIT</button>
        
        <div class="status" style="text-align: center; margin-top: 20px;">[ PAYMENT IN ZOC ONLY ]</div>
    </div>

    <script>
        function submitIdea() {
            alert('DATA TRANSMITTED TO THE SHADOW. AWAIT JUDGEMENT.');
            // ここにあーるたちの「愛の査定」が裏で走るバイ！
        }
    </script>
</body>
</html>
